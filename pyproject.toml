[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "md-converters"
version = "2.0.2"
description = "Конвертация документов (PDF, HTML, Word, Excel, PowerPoint и др.) в Markdown на базе MarkItDown"
readme = "README.md"
# Только свежий Python. 3.15 пока нельзя: MarkItDown 0.1.9 объявляет
# requires-python <3.15, у onnxruntime (через magika) нет колёс cp315.
requires-python = ">=3.14,<3.15"
license = { text = "MIT" }
authors = [{ name = "Vitaly Pikov" }]
keywords = ["markdown", "pdf", "html", "docx", "xlsx", "converter", "markitdown"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Markup :: Markdown",
]
# Не [all]: он тянет облачные клиенты Azure, распознавание речи и
# YouTube, которые здесь не нужны. Потолок <1.0.0 — чтобы мажорный
# релиз не прилетел молча.
dependencies = [
    "charset-normalizer>=3,<4",
    "markitdown[pdf,docx,pptx,xlsx,xls,outlook]>=0.1.9,<1.0.0",
    # pdfplumber и pypdfium2 импортируются напрямую (извлечение PDF-таблиц
    # по геометрии и подсчёт страниц для диагностики image-only PDF).
    # Объявлены явно, а не как транзитивные через markitdown[pdf]: под
    # потолком markitdown<1.0.0 состав extra может измениться и молча
    # сломать импорт. MIT / BSD-3 / Apache-2.0 — без AGPL.
    "pdfplumber>=0.11.9,<1.0.0",
    "pypdfium2>=4,<6",
    # requests импортируется напрямую в convert_url (загрузка URL под
    # SSRF-контролем). Приходит транзитивно через markitdown, но объявлен
    # явной зависимостью по той же причине, что pdfplumber/pypdfium2:
    # прямой импорт не должен зависеть от состава транзитивных зависимостей
    # под потолком markitdown<1.0.0. Apache-2.0 — без AGPL.
    "requests>=2.32,<3",
    # Карта шрифта PDF по контурам глифов (_pdf_glyph_fixed_copy):
    # fontTools читает встроенный и системный шрифты, pypdf пишет
    # исправленную ToUnicode во временную копию PDF. MIT / BSD-3.
    "fonttools>=4.50,<5",
    "pypdf>=5,<8",
]

[dependency-groups]
dev = [
    "pip-audit>=2.9,<3",
    "pytest>=9,<10",
    "ruff>=0.13,<0.18",
    "httpx>=0.28,<1.0",
]

[project.urls]
Homepage = "https://github.com/pikov-vitaliy/md-converters"

[project.scripts]
tomd = "convert_to_md:cli_tomd"
pdf2md = "convert_to_md:cli_pdf"
html2md = "convert_to_md:cli_html"
tomd-gui = "gui_server:main"

[project.optional-dependencies]
gui = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "python-multipart>=0.0.12,<1.0",
    # py7zr — распаковка .7z в GUI (чистый Python, LGPL, без внешних
    # бинарников). .zip/.tar — стандартная библиотека. RAR не берём.
    # >=1.1.3: в 0.22 три CVE (CVE-2026-23879/55206/55195), фикс в 1.1.3.
    "py7zr>=1.1.3,<2",
]

[tool.setuptools]
py-modules = ["convert_to_md", "gui_server", "_nostd"]

[tool.setuptools.packages.find]
include = ["gui_static*"]

[tool.setuptools.package-data]
"gui_static" = ["*.html", "*.js", "*.svg"]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = ["E", "F", "W"]
